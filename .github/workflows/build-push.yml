name: build-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: "ComfyUI git ref (branch/tag/commit). Empty = Dockerfile default."
        required: false
        default: ""
      cuda_version:
        description: "CUDA base image version, e.g. 12.6.3. Empty = Dockerfile default."
        required: false
        default: ""
  schedule:
    # Weekly refresh of floating refs: Monday ~23:00 Europe/Rome (21:00 UTC).
    - cron: "0 21 * * 1"

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute build args
        id: buildargs
        env:
          IN_COMFYUI_REF: ${{ github.event.inputs.comfyui_ref }}
          IN_CUDA_VERSION: ${{ github.event.inputs.cuda_version }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "args<<EOF"
            [ -n "${IN_COMFYUI_REF}" ] && echo "COMFYUI_REF=${IN_COMFYUI_REF}"
            [ -n "${IN_CUDA_VERSION}" ] && echo "CUDA_VERSION=${IN_CUDA_VERSION}"
            echo "VERSION=${VERSION}"
            echo "REVISION=${REVISION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.buildargs.outputs.args }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
